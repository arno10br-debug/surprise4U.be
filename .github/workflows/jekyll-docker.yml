name: Verrassing voor mijn prinses

on:
  schedule:
    - cron: "0 3 7 8 *"   # 7 augustus 03:00 UTC = 05:00 Noorwegen
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir public
          
          # De startpagina is altijd beschikbaar
          cp index.html public/

          # PDF wordt pas vanaf 7 augustus gepubliceerd
          if [ "$(date -u +%Y-%m-%d)" = "2026-08-07" ]; then
            cp muisje.pdf public/
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish GitHub Pages
        uses: actions/deploy-pages@v4
